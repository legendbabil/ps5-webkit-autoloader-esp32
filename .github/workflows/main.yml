name: Build PS5 WebKit Autoloader ESP32

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            make \
            cmake \
            gcc \
            g++ \
            python3 \
            python3-pip \
            curl \
            unzip

      - name: Install Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          sudo mv bin/arduino-cli /usr/local/bin/arduino-cli
          arduino-cli version

      - name: Configure Arduino CLI
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index

      - name: Install ESP32 Arduino Core
        run: |
          arduino-cli core install esp32:esp32@2.0.11
          arduino-cli core list

      - name: Build mklittlefs
        run: |
          git clone --depth 1 https://github.com/earlephilhower/mklittlefs.git
          cd mklittlefs
          make -j$(nproc)

          if [ ! -f mklittlefs ]; then
            echo "ERROR: mklittlefs build failed"
            exit 1
          fi

          sudo cp mklittlefs /usr/local/bin/mklittlefs
          sudo chmod +x /usr/local/bin/mklittlefs

      - name: Verify mklittlefs
        run: |
          which mklittlefs
          ls -lh "$(which mklittlefs)"

      - name: Make executable
        run: |
          chmod +x Makefile || true

      - name: Build firmware
        run: |
          make

      - name: Show generated files
        if: always()
        run: |
          echo "===== BIN FILES ====="
          find . -type f \( -name "*.bin" -o -name "*.elf" \) -print

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ps5-webkit-autoloader-esp32
          path: |
            **/*.bin
            **/*.elf
          if-no-files-found: error
