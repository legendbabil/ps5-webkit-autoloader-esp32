name: Build PS5 WebKit Autoloader ESP32

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make \
            gcc \
            g++ \
            cmake \
            python3 \
            python3-pip \
            curl \
            unzip

      - name: Install Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          sudo mv bin/arduino-cli /usr/local/bin/arduino-cli
          arduino-cli version

      - name: Configure Arduino CLI
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index

      - name: Install ESP32 Core 2.0.11
        run: |
          arduino-cli core install esp32:esp32@2.0.11
          arduino-cli core list

      - name: Build existing mklittlefs submodule
        run: |
          echo "Checking mklittlefs..."
          ls -la mklittlefs

          cd mklittlefs

          git submodule update --init --recursive

          make clean || true
          make -j$(nproc)

          echo "Checking generated mklittlefs..."
          ls -lh mklittlefs

          if [ ! -f mklittlefs ]; then
            echo "ERROR: mklittlefs was not built"
            exit 1
          fi

          chmod +x mklittlefs

      - name: Install mklittlefs into PATH
        run: |
          sudo cp mklittlefs/mklittlefs /usr/local/bin/mklittlefs
          sudo chmod +x /usr/local/bin/mklittlefs

          echo "mklittlefs location:"
          which mklittlefs

          echo "mklittlefs version:"
          mklittlefs --version || true

      - name: Verify project structure
        run: |
          echo "===== ROOT ====="
          ls -la

          echo "===== MKLITTLEFS ====="
          ls -la mklittlefs

          echo "===== SUBMODULES ====="
          git submodule status

      - name: Build firmware
        run: |
          make

      - name: Show generated firmware
        if: always()
        run: |
          echo "===== GENERATED BIN FILES ====="
          find . -type f -name "*.bin" -print

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ps5-webkit-autoloader-esp32
          path: |
            build/**/*.bin
            build/**/*.elf
          if-no-files-found: error
