name: Build PS5 WebKit Autoloader ESP32

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ca-certificates \
            curl \
            git \
            jq \
            nodejs \
            npm \
            openssl \
            python3 \
            unzip \
            xz-utils

      - name: Install project dependencies
        run: |
          chmod +x install-deps.sh
          ./install-deps.sh

      - name: Verify ESP32 Core
        run: |
          echo "===== Arduino Core ====="

          arduino-cli \
            --config-file "$HOME/.arduino15/arduino-cli-esp32-2.yaml" \
            core list

          echo "===== Expected Core Directory ====="

          test -d "$HOME/.arduino15-esp32-2/packages/esp32/hardware/esp32/2.0.11"

          echo "ESP32 Core 2.0.11 OK"

      - name: Build mklittlefs
        run: |
          echo "===== mklittlefs ====="

          git submodule update --init --recursive

          make -C mklittlefs

          test -x mklittlefs/mklittlefs

          echo "mklittlefs OK"
          ls -lh mklittlefs/mklittlefs

      - name: Build firmware
        run: |
          make

      - name: Show generated firmware
        if: always()
        run: |
          echo "===== GENERATED BIN FILES ====="
          find build -type f -name "*.bin" -print 2>/dev/null || true

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ps5-webkit-autoloader-esp32
          path: |
            build/**/*.bin
          if-no-files-found: error
