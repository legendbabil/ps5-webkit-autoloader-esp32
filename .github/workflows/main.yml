name: Build PS5 WebKit Autoloader ESP32

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ca-certificates \
            curl \
            git \
            jq \
            nodejs \
            npm \
            openssl \
            python3 \
            unzip \
            xz-utils

      - name: Install Arduino CLI
        run: |
          mkdir -p "$HOME/bin"

          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh \
            | BINDIR="$HOME/bin" sh

          echo "$HOME/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/bin:$PATH"

          arduino-cli version

      - name: Initialize Arduino CLI
        run: |
          export PATH="$HOME/bin:$PATH"

          mkdir -p "$HOME/.arduino15"

          arduino-cli config init

          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json

          arduino-cli core update-index

      - name: Install ESP32 Core 2.0.11
        run: |
          export PATH="$HOME/bin:$PATH"

          mkdir -p "$HOME/.arduino15-esp32-2"

          arduino-cli \
            --config-file "$HOME/.arduino15/arduino-cli.yaml" \
            --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json \
            core install esp32:esp32@2.0.11

      - name: Verify ESP32 Core
        run: |
          export PATH="$HOME/bin:$PATH"

          arduino-cli core list

          find "$HOME/.arduino15" \
            -path "*/esp32/hardware/esp32/2.0.11" \
            -type d \
            -print

      - name: Prepare project dependencies
        run: |
          git submodule update --init --recursive

      - name: Build mklittlefs
        run: |
          make -C mklittlefs -j$(nproc)

          test -x mklittlefs/mklittlefs

          echo "mklittlefs built successfully"

      - name: Build firmware
        env:
          PATH: /home/runner/bin:$PATH
        run: |
          make

      - name: Show generated files
        if: always()
        run: |
          echo "===== BIN FILES ====="
          find . -type f -name "*.bin" -print

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ps5-webkit-autoloader-esp32
          path: |
            **/*.bin
            **/*.elf
          if-no-files-found: error
